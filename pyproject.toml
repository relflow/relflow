[project]
name = "relflow"
version = "0.2.2"
description = "Relationship Flow: schema-first PyTorch models for hierarchical, nested, and sequence data"
readme = "README.md"
authors = [
    { name = "Grantham Taylor" },
    { name = "Reid Taylor" },
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "beartype>=0.21.0",
    "rich>=14.0.0",
    "pydantic>=2.11.7",
    "anytree>=2.13.0",
    "pyarrow>=21.0.0",
    "polars>=1.35.2",
    "numpy>=2.2.6",
    "lightning>=2.6.4",
    "tensordict>=0.10.0",
    "torch>=2.7.1",
    "torchmetrics>=1.9.0",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
serving = [
    "fastapi>=0.124.0",
    "orjson>=3.10.0",
    "pydantic-settings>=2.10.1",
    "uvicorn>=0.38.0",
]
text = [
    "transformers>=4.55.0",
]
typing = [
    "pyarrow-stubs>=20.0.0.20260819",
]

[dependency-groups]
dev = [
    "ruff>=0.12.12",
    "pytest>=8.4.1",
    "pytest-xdist>=3.8.0",
    "fastapi>=0.124.0",
    "orjson>=3.10.0",
    "pydantic-settings>=2.10.1",
    "uvicorn>=0.38.0",
    "pyrefly>=1.3.0,<2",
    "pre-commit>=4.3.0",
    "pyarrow-stubs>=20.0.0.20260819",
    "transformers>=4.55.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
relflow = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["relflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = ["-n", "auto"]
markers = [
    "proof: deterministic synthetic-data checks of learned model behavior",
]

[tool.ruff]
line-length = 120
extend-exclude = ["docs/_extensions"]
lint.extend-select = ["I"]

[tool.pyrefly]
project-includes = ["src/relflow", "tests/typing"]
search-path = ["src"]
python-version = "3.12"
preset = "default"
