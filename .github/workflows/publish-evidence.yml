name: Publish evidence assets

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_call:
    inputs:
      library_run_id:
        description: Successful main CI run containing the complete paired report
        type: string
        required: true
      version:
        description: Package version being released
        type: string
        required: true
      source_sha:
        description: Exact source checked by release CI
        type: string
        required: true
  workflow_dispatch:
    inputs:
      preview:
        description: Retain CI plots and refresh its current documentation preview
        type: boolean
        default: false
      library_run_id:
        description: Successful main CI run containing the complete paired report
        required: true
      version:
        description: Package version being released (release mode only)
        required: false

permissions:
  contents: read

concurrency:
  group: evidence-publication-${{ github.event.workflow_run.id || inputs.library_run_id || inputs.version }}
  queue: max

jobs:
  publish:
    # Reusable workflows inherit the caller's event, including workflow_run.
    if: inputs.library_run_id != '' && !inputs.preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked --project docs
      - name: Validate and freeze the versioned evidence assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.library_run_id }}
          VERSION: ${{ inputs.version }}
        run: >-
          uv run --project docs python evidence/publication.py
          --run-id "$SOURCE_RUN" --version "$VERSION"
          --output "$RUNNER_TEMP/evidence-publication"
      - name: Attach the validated publication assets
        uses: actions/upload-artifact@v4
        with:
          name: evidence-release-assets-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evidence-publication/publication.json
            ${{ runner.temp }}/evidence-publication/measurements.md
            ${{ runner.temp }}/evidence-publication/docs-base.txt
            ${{ runner.temp }}/evidence-publication/github-run.json
            ${{ runner.temp }}/evidence-publication/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 30
      - name: Attach the rendered release review site
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site-attempt-${{ github.run_attempt }}
          path: docs/site
          if-no-files-found: ignore
          retention-days: 7

  preview:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.preview) ||
      (github.event_name == 'workflow_run' &&
       inputs.library_run_id == '' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the frozen publication verifier
        uses: actions/checkout@v4
        with:
          repository: relflow/relflow
          ref: '787625f1b2a88fda23d002999dc25499f735ad41'
          path: executor
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml==6.0.3
      - name: Verify and publish the exact CI plot bundle, then refresh Read the Docs
        env:
          GH_TOKEN: ${{ github.token }}
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.library_run_id }}
          EVIDENCE_EXECUTOR: '787625f1b2a88fda23d002999dc25499f735ad41'
          EVIDENCE_HELPER: '9b0dd6037f4a8bc48ef0638aa6329eb859d87c16'
        run: >-
          python executor/evidence/preview.py --run-id "$SOURCE_RUN"
          --helper "$EVIDENCE_HELPER" --executor "$EVIDENCE_EXECUTOR"
          --output "$RUNNER_TEMP/evidence-preview"
