name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      evidence_ref:
        description: Optional full repository commit SHA for an explicit suite validation
        type: string
        required: false
      evidence_base:
        description: Optional full comparison-base SHA for manual Evidence validation
        type: string
        required: false
      force_fresh_evidence:
        description: Execute every Evidence task without reusing completed reports or baselines
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.evidence_ref || '' }}
  cancel-in-progress: true

jobs:
  package:
    name: Package
    uses: ./.github/workflows/package.yml

  tests:
    name: Tests
    needs: package
    uses: ./.github/workflows/tests.yml
    with:
      distribution_artifact: ${{ needs.package.outputs.artifact_name }}

  docs:
    name: Documentation
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml

  evidence:
    name: Evidence
    needs: package
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/evidence.yml
    with:
      suite_ref: ${{ inputs.evidence_ref || github.sha }}
      distribution_artifact: ${{ needs.package.outputs.artifact_name }}
      force_fresh: ${{ inputs.force_fresh_evidence || false }}
      baseline_ref: ${{ inputs.evidence_base || '' }}

  required:
    name: CI / required
    if: always()
    needs: [tests, docs, evidence, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all jobs for this event
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: python
        run: |
          import json
          import os
          event = os.environ["EVENT_NAME"]
          assert event in {"push", "pull_request", "merge_group", "workflow_dispatch"}, event
          if event == "pull_request":
              assert os.environ["PR_REPOSITORY"] == os.environ["REPOSITORY"], "Fork evidence needs a trusted run"
          expected = {
              "tests": "success",
              "docs": "success",
              "evidence": "success",
              "package": "success",
          }
          actual = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items()}
          assert actual == expected, {"expected": expected, "actual": actual}
