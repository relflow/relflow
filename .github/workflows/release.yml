name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  queue: max

jobs:
  detect_version:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
      ci_run_id: ${{ steps.ci.outputs.run_id }}
      source_sha: ${{ steps.ci.outputs.source_sha }}
    steps:
      - name: Identify successful CI for the exact current main commit
        id: ci
        uses: actions/github-script@v9
        with:
          script: |
            const repo = context.repo;
            const main = (await github.rest.git.getRef({ ...repo, ref: 'heads/main' })).data.object.sha;
            let run = context.payload.workflow_run;
            if (run && run.head_sha !== main) {
              core.info('Skipping a superseded main commit.');
              core.setOutput('current', 'false');
              return;
            }
            if (!run) {
              const response = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'ci.yml', branch: 'main', event: 'push',
                head_sha: main, status: 'success', per_page: 100,
              });
              run = response.data.workflow_runs.find(item => item.head_sha === main);
            }
            if (!run || run.conclusion !== 'success' || run.event !== 'push' ||
                run.head_branch !== 'main' || run.head_sha !== main ||
                run.head_repository.full_name !== `${repo.owner}/${repo.repo}` || run.path !== '.github/workflows/ci.yml') {
              throw new Error('Release requires a successful CI push run for the current main commit. Re-run the main push CI first.');
            }
            core.setOutput('run_id', String(run.id));
            core.setOutput('source_sha', run.head_sha);
            core.setOutput('current', 'true');
      - uses: actions/checkout@v4
        if: steps.ci.outputs.current == 'true'
        with:
          ref: ${{ steps.ci.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.ci.outputs.current == 'true'
        with:
          python-version: '3.12'
      - name: Detect an unpublished package version
        id: version
        if: steps.ci.outputs.current == 'true'
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          try:
              with urlopen(f"https://pypi.org/pypi/relflow/{version}/json", timeout=15) as response:
                  published = response.status == 200
          except HTTPError as error:
              if error.code != 404:
                  raise
              published = False
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\nshould_publish={str(not published).lower()}\n")
          print(f"relflow {version}: {'already published' if published else 'ready to publish from checked CI artifacts'}")

  release:
    needs: detect_version
    if: needs.detect_version.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ needs.detect_version.outputs.ci_run_id }}
      - name: Create or update GitHub release from checked distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.detect_version.outputs.version }}
          SOURCE_SHA: ${{ needs.detect_version.outputs.source_sha }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --clobber
          else
            gh release create "v${VERSION}" dist/* --target "$SOURCE_SHA" --title "relflow ${VERSION}" --generate-notes
          fi

  publish:
    needs: [detect_version, release]
    if: needs.detect_version.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/relflow
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ needs.detect_version.outputs.ci_run_id }}
      - uses: pypa/gh-action-pypi-publish@release/v1
