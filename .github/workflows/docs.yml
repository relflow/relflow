name: Build and deploy docs

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  # Refresh branches that still contain an older copy of this workflow.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Render proposed docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out proposed docs
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Render docs
        run: make render

  discover:
    name: Discover documentation branches
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.branches.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover branches at their current commits
        id: branches
        run: |
          matrix="$(python .github/scripts/docs.py discover)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  render:
    name: Render ${{ matrix.name }} docs
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - name: Check out publication scripts
        uses: actions/checkout@v4
        with:
          path: workflow

      - name: Check out ${{ matrix.name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: branch

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up docs Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render docs
        env:
          DOCS_SITE_URL: ${{ matrix.url }}
        run: uv run --no-project --with pyyaml python workflow/.github/scripts/render_docs.py branch

      - name: Upload rendered docs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: branch/docs/site
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble Pages site
    needs: [discover, render]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download branch docs
        uses: actions/download-artifact@v4
        with:
          pattern: docs-*
          path: artifacts

      - name: Assemble main and branch URLs
        env:
          DOCS_MATRIX: ${{ needs.discover.outputs.matrix }}
        run: python .github/scripts/docs.py assemble artifacts site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: assemble
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
