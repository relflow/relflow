name: Evidence

on:
  workflow_call:
    outputs:
      run_attempt:
        value: ${{ jobs.run.outputs.run_attempt }}
    inputs:
      suite_ref:
        type: string
        required: true
      distribution_artifact:
        type: string
        default: python-package-distributions
      baseline_ref:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  wheels:
    name: Build exact candidate and baseline wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the trusted runtime resolver
        uses: actions/checkout@v4
        with:
          repository: relflow/relflow
          ref: '81f803c00bd6b08e4c24e551d832a0082f387d9c'
          path: executor
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.12'
          version: '0.13.7'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.distribution_artifact }}
          path: package/
      - name: Build supplied revisions for the isolated CPU suite
        id: inputs
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.baseline_ref }}
          SUITE_REF: ${{ inputs.suite_ref }}
        run: |
          if [[ -z "$BASELINE_SHA" || "$BASELINE_SHA" =~ ^0+$ ]]; then
            BASELINE_SHA="$(git -C candidate rev-parse HEAD^1)"
          fi
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C candidate worktree add --detach "$GITHUB_WORKSPACE/baseline" "$BASELINE_SHA"
          python candidate/scripts/release.py verify package --source-sha "$CANDIDATE_SHA"
          mkdir -p inputs/candidate inputs/baseline
          cp package/* inputs/candidate/
          if [[ "$BASELINE_SHA" == "$CANDIDATE_SHA" ]]; then
            cp inputs/candidate/*.whl inputs/baseline/
          else
            uv build --project "$GITHUB_WORKSPACE/baseline" --wheel --out-dir "$GITHUB_WORKSPACE/inputs/baseline"
          fi
          python executor/evidence/resolve.py --project "$GITHUB_WORKSPACE/candidate" --output "$GITHUB_WORKSPACE/inputs"
          export BASELINE_SHA
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          request = {
              "candidate": os.environ["CANDIDATE_SHA"],
              "baseline": os.environ["BASELINE_SHA"],
              "suite": os.environ["SUITE_REF"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
          }
          Path("inputs/request.json").write_text(json.dumps(request, sort_keys=True, indent=2) + "\n")
          PY
          echo "baseline_sha=$BASELINE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-inputs-attempt-${{ github.run_attempt }}
          path: inputs/
          retention-days: 7
          if-no-files-found: error
    outputs:
      baseline_sha: ${{ steps.inputs.outputs.baseline_sha }}

  run:
    name: Run full paired suite on GitHub
    needs: wheels
    permissions:
      contents: read
      actions: read
    with:
      suite_ref: ${{ inputs.suite_ref }}
      baseline_sha: ${{ needs.wheels.outputs.baseline_sha }}
    uses: relflow/relflow/.github/workflows/evidence-hosted.yml@e54a9f155bf4dd114a1453aeff07f21ea1a915ad
