    script: proofs/temporal/month_from_day_of_year.py
    page: docs/proofs/temporal/month-from-day-of-year.py
    historical:
      status: Passing
      source_revision: 810b3fe3b0b25c2c7a718571d83f6006f23110c3
      sources:
