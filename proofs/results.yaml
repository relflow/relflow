  P034:
    script: proofs/relational/supplied_peer_mean_control.py
    page: docs/proofs/relational/supplied-peer-mean-control.py
    historical:
      status: Passing
      source_revision: 810b3fe3b0b25c2c7a718571d83f6006f23110c3
