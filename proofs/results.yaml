        | Removed-overlap AUC against retained labels | 0.35–0.65 | 0.4940 |
        | Mean invariant probability drift | ≤ 0.15 | 0.0006 |
        | Mean positive probability drop after removal | Absolute value ≤ 0.10 | Approximately 0.0000 |
