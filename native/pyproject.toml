[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "relflow-native"
dynamic = ["version"]
description = "Native kernels and shared local runtimes for relflow"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.2.6", "pyarrow>=20"]

[project.urls]
Source = "https://github.com/relflow/relflow/tree/main/native"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "relflow_native.native"
locked = true
strip = true
