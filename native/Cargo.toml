[package]
name = "relflow-native"
version = "0.1.0"
description = "Native kernels and shared local runtimes for relflow"
license = "Apache-2.0"
repository = "https://github.com/relflow/relflow"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "native"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3", "dep:arrow-array", "dep:arrow-data", "dep:arrow-pyarrow", "dep:arrow-schema"]

[dependencies]
anyhow = "1"
moka = { version = "=0.12.16", features = ["sync"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
constant_time_eq = "0.4"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }
arrow-array = { version = "60.1", optional = true }
arrow-data = { version = "60.1", optional = true }
arrow-schema = { version = "60.1", optional = true }
arrow-pyarrow = { version = "60.1", optional = true }

[dev-dependencies]
tempfile = "3"
