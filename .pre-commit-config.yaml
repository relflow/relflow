fail_fast: true

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Format with Ruff
        entry: uv run ruff format
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: Run Ruff
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false
        always_run: true

      - id: pyrefly-check
        name: Run Pyrefly
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: docs
        name: Render Docs (isolated)
        entry: make check-docs
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Run Pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
