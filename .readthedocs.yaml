version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "24"
  jobs:
    install:
      - python -m pip install uv==0.7.9
      # Read the Docs uses asdf shims for console scripts installed by pip.
      - asdf reshim python
      - make prepare
    build:
      html:
        # An unpublished latest checkout exits 183 until Release publishes its Evidence.
        - uv run --project docs python -m docs.publish
