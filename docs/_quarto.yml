project:
  type: website
  output-dir: site
  pre-render:
    - uv run --directory .. --project docs python -m evidence.render
  resources:
    - assets/fonts/OFL.txt
    - evidence/_generated/*.py
  render:
    - index.qmd
    - "**/*.qmd"
    - "evidence/*/*.py"

website:
  site-url: https://relflow.ai/
  repo-url: https://github.com/relflow/relflow
  repo-subdir: docs
  repo-branch: main
  repo-actions: [source, issue]
  title: relflow
  description: "A model factory for typed, nested data: generate custom neural architectures, train models, and serve predictions and learned representations."
  favicon: assets/branding/logos/logo.svg
  image: assets/branding/logos/logo.light.png
  page-navigation: true
  navbar:
    title: relflow
    logo: assets/branding/logos/logo.navbar.svg
    logo-alt: relflow
  sidebar:
    style: floating
    search: false
    collapse-level: 1
    contents:
      - section: Start here
        contents:
          - href: index.qmd
            text: Overview
          - href: learn/your-first-model.qmd
            text: Your first model
          - href: learn/add-transaction-history.qmd
            text: Add transaction history
          - href: learn/featureless-models.qmd
            text: Featureless models
          - href: learn/prepare-observations.qmd
            text: Prepare observations
          - href: learn/train-and-save.qmd
            text: Train and save
          - href: learn/read-predictions.qmd
            text: Read predictions
          - href: learn/evaluation.qmd
            text: Evaluation
      - section: Extend the model
        contents:
          - href: learn/profile-context-and-a-second-outcome.qmd
            text: Profile context and a second outcome
          - href: learn/nested-context-and-account-outcomes.qmd
            text: Nested context and account outcomes
          - href: learn/pretraining-and-fine-tuning.qmd
            text: Pretraining and fine-tuning
          - href: learn/reusable-representations.qmd
            text: Reusable representations
      - section: Use cases
        contents:
          - href: use-cases/index.qmd
            text: Overview
          - href: use-cases/time-series-forecasting.qmd
            text: Time series forecasting
          - href: use-cases/recommendations.qmd
            text: Recommendations
          - href: use-cases/customer-outcomes.qmd
            text: Customer outcomes
          - href: use-cases/relational-prediction.qmd
            text: Relational prediction
          - href: use-cases/representation-learning.qmd
            text: Representation learning
      - section: Guides
        contents:
          - href: guides/data-modules.qmd
            text: Data modules
          - href: guides/preprocessing.qmd
            text: Preprocessing
          - href: guides/query-paths.qmd
            text: Query paths
          - href: guides/postprocessing.qmd
            text: Postprocessing
          - href: guides/batch-inference.qmd
            text: Batch inference
          - href: guides/serving.qmd
            text: Serving
          - href: guides/performance.qmd
            text: Performance
          - href: guides/training-options.qmd
            text: Training options
          - href: guides/checkpoints-ema-and-resuming.qmd
            text: Checkpoints, EMA, and resuming
          - href: guides/model-templates.qmd
            text: Model templates
          - href: guides/schema-mutation.qmd
            text: Schema mutation
      - section: Concepts
        contents:
          - href: concepts/model-tree.qmd
            text: Model tree
          - href: concepts/how-fields-interact.qmd
            text: How fields interact
          - href: concepts/branch-summaries.qmd
            text: Branch summaries
          - href: concepts/tree-routing-and-decoding.qmd
