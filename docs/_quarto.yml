project:
  type: website
  output-dir: site
  pre-render:
    - uv run --no-project --with pyyaml python ../proofs/render.py
  resources:
    - assets/fonts/OFL.txt
    - proofs/_generated/results.yaml
    - proofs/_generated/*.py
  render:
    - index.qmd
    - "**/*.qmd"
    - "proofs/*/*.py"

website:
  title: relflow
  favicon: assets/branding/logos/logo.svg
  image: assets/branding/logos/logo.light.png
  navbar:
    title: relflow
    logo: assets/branding/logos/logo.navbar.svg
    logo-alt: relflow
  sidebar:
    style: floating
    search: false
    collapse-level: 99
    contents:
      - href: index.qmd
        text: Home
      - href: getting-started.qmd
        text: Getting Started
      - href: proofs.qmd
        text: Proofs
      - section: Model
        contents:
          - href: core-concepts/model-tree.qmd
            text: Structure And Context
          - href: core-concepts/binding-data.qmd
            text: Binding Data
          - href: core-concepts/querypaths.qmd
            text: Query Paths
          - href: core-concepts/dynamic-masking.qmd
            text: Masking And Objectives
          - href: core-concepts/vocabulary.qmd
            text: Online Vocabulary
          - href: core-concepts/embeddings.qmd
            text: Embeddings
          - href: core-concepts/jitter.qmd
            text: Jitter
      - section: Data Types
        contents:
          - href: core-concepts/data-types.qmd
            text: Data Types
          - href: data-types/branch.qmd
            text: Branch
          - href: data-types/boolean.qmd
            text: Boolean
          - href: data-types/category.qmd
            text: Category
          - href: data-types/cluster.qmd
            text: Cluster
          - href: data-types/dateparts.qmd
            text: DateParts
          - href: data-types/hash.qmd
            text: Hash
          - href: data-types/number.qmd
            text: Number
          - href: data-types/set.qmd
            text: Set
          - href: data-types/text.qmd
            text: Text
          - href: data-types/vector.qmd
            text: Vector
      - section: Train
        contents:
          - href: guides/data-modules.qmd
            text: Arrow And Polars
          - href: guides/preprocessors.qmd
            text: Preprocessing
          - href: guides/lightning.qmd
            text: Training And Checkpoints
          - href: guides/pretraining.qmd
            text: Pretraining And Fine-Tuning
          - href: guides/evaluation.qmd
            text: Evaluation
          - href: guides/performance.qmd
            text: Performance
      - section: Predict
        contents:
          - href: guides/prediction-output.qmd
            text: Output
          - href: guides/postprocessors.qmd
            text: Postprocessing
          - href: guides/batch-inference.qmd
            text: Batch Inference
          - href: guides/serving.qmd
            text: Serving
      - section: Extend
        contents:
          - href: guides/schema-mutation.qmd
            text: Schema Mutation
          - href: guides/custom-tensorfields.qmd
            text: Custom Tensorfields
          - href: guides/troubleshooting.qmd
            text: Troubleshooting
          - href: reference/public-api.qmd
            text: API Map
      - section: Case Studies
        contents:
          - href: case-studies/customer-risk.qmd
            text: Customer Risk Example
  page-footer:
    border: true
    left: Grantham Taylor
    right:
      - text: GitHub
        icon: github
        href: https://github.com/relflow/relflow
      - text: Discord
        icon: discord
        href: https://discord.gg/DVyZUkvTFA
      - text: LinkedIn
        icon: linkedin
        href: https://www.linkedin.com/in/granthamtaylor
  search: true

format:
  html:
    css: assets/stylesheets/branding.css
    include-in-header: assets/color-scheme.html
    include-after-body: assets/sidebar.html
    theme:
      light:
        - flatly
        - assets/stylesheets/theme-light.scss
      dark:
        - darkly
        - assets/stylesheets/theme-dark.scss
    toc: false
    code-copy: true
    code-overflow: scroll
    respect-user-color-scheme: true

engine: markdown
execute:
  enabled: false
  eval: false

filters:
  - typst-render

extensions:
  typst-render:
    root: /
    format: svg
    background:
      light: none
      dark: "#181c1b"
    output-directory: /assets/diagrams
    preamble: /assets/typst/preamble.typ
