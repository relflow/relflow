  page-footer:
    border: true
    left: Grantham Taylor
    right:
      - text: GitHub
        icon: github
        href: https://github.com/relflow/relflow
      - text: Discord
        icon: discord
        href: https://discord.gg/DVyZUkvTFA
      - text: LinkedIn
        icon: linkedin
        href: https://www.linkedin.com/in/granthamtaylor
      - text: YouTube
        icon: youtube
        href: https://www.youtube.com/@relflow-ai
  search: true

format:
  html:
    css:
      - assets/stylesheets/branding.css
      - assets/stylesheets/layout.css
      - assets/stylesheets/sidebar.css
      - assets/stylesheets/code.css
      - assets/stylesheets/versions.css
    include-in-header:
      - assets/color-scheme.html
      - assets/versions.html
    include-after-body: assets/sidebar.html
    theme:
      light:
        - flatly
        - assets/stylesheets/theme-light.scss
      dark:
        - darkly
        - assets/stylesheets/theme-dark.scss
    toc: false
    code-copy: true
    code-overflow: scroll
    respect-user-color-scheme: true

engine: markdown
execute:
  enabled: false
  eval: false

filters:
  - typst-render
  - path: assets/filters/evidence-diagrams.lua
    at: post-quarto
  - path: assets/filters/tables.lua
    # Include evidence tables inserted by evidence shortcodes.
    at: post-quarto

extensions:
  typst-render:
    root: /
    format: svg
    background:
      light: none
      dark: "#181c1b"
    output-directory: /assets/diagrams
    preamble: /assets/typst/preamble.typ
