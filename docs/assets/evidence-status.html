<script>
  {
    const listing = document.querySelector("#listing-evidence");

    // Quarto initializes the listing first; keep every matching evidence visible.
    document.addEventListener("DOMContentLoaded", () => {
      listing.querySelector(".listing-pagination")?.remove();
      window["quarto-listings"]["listing-evidence"].show(1, Infinity);
    });

    // Contain wide rows without scrolling the filter and sort controls.
    const table = listing.querySelector("table");
    const viewport = document.createElement("div");
    viewport.className = "table-responsive";
    viewport.tabIndex = 0;
    viewport.setAttribute("role", "region");
    viewport.setAttribute("aria-label", "Evidence table");
    table.before(viewport);
    viewport.append(table);

    const sort = listing.querySelector("#listing-evidence-sort");
    for (const option of sort.querySelectorAll('option[value=""], option[value="index"]')) {
      option.remove();
    }
    sort.value = "listing-evidence-id";

    // Keep Quarto's plain status text intact for listing search and sorting.
    for (const badge of listing.querySelectorAll(".listing-evidence-status")) {
      badge.classList.add("evidence-status");
      badge.dataset.evidenceStatus = badge.textContent.trim();
    }

    // Handle actual cell clicks; the title link remains the keyboard entry point.
    const navigate = (event) => {
      if (event.button !== 0 && event.button !== 1) return;
      if (event.target.closest("a, button, input, select, textarea")) return;
      if (window.getSelection()?.toString()) return;
      const link = event.target.closest("tbody tr")?.querySelector("a.listing-title");
      if (!link) return;

      event.preventDefault();
      if (event.ctrlKey || event.metaKey || event.button === 1) {
        window.open(link.href, "_blank", "noopener");
      } else {
        link.click();
      }
    };
    listing.addEventListener("click", navigate);
    listing.addEventListener("auxclick", navigate);
  }
</script>
