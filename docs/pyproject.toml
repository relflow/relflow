[project]
name = "relflow-docs"
version = "0.1.0"
description = "Static documentation tooling for RelFlow"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.3"]

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.15.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "../evidence/tests"]
pythonpath = ["..", "../evidence", "../evidence/experiments"]
norecursedirs = ["runtime"]

[tool.ruff]
line-length = 120
extend-exclude = ["docs/_extensions", "docs/evidence", "docs/site"]
lint.extend-select = ["I"]

[tool.ruff.lint.isort]
known-third-party = ["relflow"]
