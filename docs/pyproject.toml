[project]
name = "relflow-docs"
version = "0.1.0"
description = "Static documentation publishing and Evidence verification for relflow"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "griffe==2.4.1",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.15.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "../evidence/tests"]
pythonpath = ["..", "../evidence", "../evidence/experiments"]
norecursedirs = ["runtime"]
markers = ["integration: explicit runtime, worker, distributed, or accelerator checks"]

[tool.ruff]
line-length = 120
extend-exclude = ["**/evidence/runs/**"]
lint.extend-select = ["I"]

[tool.ruff.lint.isort]
known-third-party = ["relflow"]
